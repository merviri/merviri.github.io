# Merviri: envío de avisos (notificaciones). Vive en el repositorio privado
# merviri/datos. Los avisos llegan cifrados para cada móvil; este flujo solo
# los firma (clave VAPID, guardada como secreto) y los entrega.
#  - Al momento: la app lo lanza (workflow_dispatch) con los avisos cifrados.
#  - Cada hora de 7/8 a 22/23 (hora de Madrid): manda los avisos programados
#    de avisos/programados.json (resumen de la mañana, aniversarios…).
# Cada ejecución gasta 1 minuto de los 2.000 gratis al mes.
# Las acciones se fijan por commit (versión entre comentarios) por seguridad.
name: Avisos

on:
  workflow_dispatch:
    inputs:
      envios:
        description: "Avisos cifrados (JSON)"
        required: true
        type: string
  schedule:
    - cron: "5 6-21 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: avisos-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/avisos
            avisos
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enviar
        run: node .github/avisos/enviar.mjs
        env:
          EVENTO: ${{ github.event_name }}
          # Se pasan como variables de entorno (nunca dentro del script) para evitar inyecciones.
          ENVIOS: ${{ inputs.envios }}
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
